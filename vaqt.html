<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vaqt statistikasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Vaqt statistikasi</h1>
        <p>Saytda o'tkazgan vaqtim</p>

        <nav>
            <a href="index.html">Bosh sahifa</a>
            <a href="kundalik.html">Kundalik</a>
            <a href="zametka.html">Zametkalar</a>
            <a href="vazifalar.html">Vazifalar</a>
            <a href="maqsadlar.html">Maqsadlar</a>
            <a href="vaqt.html">Vaqt</a>
            <a href="saytlar.html">Foydali saytlar</a>
        </nav>
    </header>

    <div class="container">

        <h2>Saytda o'tkazilgan vaqt</h2>

        <h1 id="timer">00:00:00</h1>

        <p>
            Bu hisoblagich sayt ochiq turgan vaqtni hisoblaydi.
        </p>

        <button onclick="resetTime()">Vaqtni tozalash</button>

    </div>

    <script>

        let startTime = Date.now();

        let savedTime =
            Number(localStorage.getItem("siteTime")) || 0;

        function updateTimer() {

            let currentTime = Date.now();

            let currentSession =
                Math.floor((currentTime - startTime) / 1000);

            let totalSeconds =
                savedTime + currentSession;

            let hours =
                Math.floor(totalSeconds / 3600);

            let minutes =
                Math.floor((totalSeconds % 3600) / 60);

            let seconds =
                totalSeconds % 60;

            hours = String(hours).padStart(2, "0");

            minutes = String(minutes).padStart(2, "0");

            seconds = String(seconds).padStart(2, "0");

            document.getElementById("timer").textContent =
                hours + ":" + minutes + ":" + seconds;
        }

        setInterval(updateTimer, 1000);

        window.addEventListener("beforeunload", function() {

            let currentTime = Date.now();

            let currentSession =
                Math.floor((currentTime - startTime) / 1000);

            localStorage.setItem(
                "siteTime",
                savedTime + currentSession
            );

        });

        function resetTime() {

            localStorage.removeItem("siteTime");

            savedTime = 0;

            startTime = Date.now();

            updateTimer();
        }

        updateTimer();

    </script>

</body>
</html>
