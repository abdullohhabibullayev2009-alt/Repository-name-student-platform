<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Maqsadlar</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .goal-form {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .goal-card {
            background-color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .goal-title {
            font-size: 20px;
            font-weight: bold;
        }

        .goal-date {
            color: #666;
        }

        .progress-box {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-bar {
            height: 100%;
            background-color: #222;
            width: 0%;
        }

        .progress-text {
            font-weight: bold;
        }

        .goal-buttons {
            margin-top: 12px;
        }

        .goal-buttons button {
            margin-right: 5px;
        }

        .empty {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>

    <h1>Mening Maqsadlarim</h1>

    <p>Kelajakda erishmoqchi bo'lgan maqsadlarim</p>

    <nav>
        <a href="index.html">Bosh sahifa</a>
        <a href="kundalik.html">Kundalik</a>
        <a href="zametka.html">Zametkalar</a>
        <a href="vazifalar.html">Vazifalar</a>
        <a href="maqsadlar.html">Maqsadlar</a>
        <a href="vaqt.html">Vaqt</a>
        <a href="saytlar.html">Foydali saytlar</a>
    </nav>

</header>


<div class="container">

    <div class="goal-form">

        <h2>Yangi maqsad</h2>


        <label>Maqsad:</label>

        <br>

        <input
            id="goalInput"
            type="text"
            placeholder="Masalan: Ingliz tilidan B2 olish"
        >


        <br><br>


        <label>Muddat:</label>

        <br>

        <input
            id="goalDate"
            type="date"
        >


        <br><br>


        <label>Boshlang'ich progress:</label>

        <br>

        <input
            id="goalProgress"
            type="number"
            min="0"
            max="100"
            value="0"
        >


        <br><br>


        <button onclick="addGoal()">
            Maqsad qo'shish
        </button>

    </div>


    <h2>Maqsadlarim</h2>


    <div id="goals"></div>

</div>


<script>

    let goals =
        JSON.parse(
            localStorage.getItem("goals")
        ) || [];


    function addGoal() {

        let goalInput =
            document.getElementById(
                "goalInput"
            );


        let goalText =
            goalInput.value;


        let goalDate =
            document.getElementById(
                "goalDate"
            ).value;


        let progress =
            Number(
                document.getElementById(
                    "goalProgress"
                ).value
            );


        if (goalText === "") {

            alert("Maqsadni yozing!");

            return;

        }


        if (goalDate === "") {

            alert("Muddatni tanlang!");

            return;

        }


        if (
            progress < 0 ||
            progress > 100
        ) {

            alert(
                "Progress 0 dan 100 gacha bo'lishi kerak!"
            );

            return;

        }


        goals.push({

            text: goalText,

            date: goalDate,

            progress: progress,

            completed: progress === 100

        });


        localStorage.setItem(
            "goals",
            JSON.stringify(goals)
        );


        goalInput.value = "";


        document.getElementById(
            "goalDate"
        ).value = "";


        document.getElementById(
            "goalProgress"
        ).value = 0;


        showGoals();

    }


    function changeProgress(index) {

        let newProgress =
            prompt(
                "Yangi progressni kiriting (0-100):",
                goals[index].progress
            );


        if (newProgress === null) {

            return;

        }


        newProgress =
            Number(newProgress);


        if (
            isNaN(newProgress) ||
            newProgress < 0 ||
            newProgress > 100
        ) {

            alert(
                "0 dan 100 gacha son kiriting!"
            );

            return;

        }


        goals[index].progress =
            newProgress;


        goals[index].completed =
            newProgress === 100;


        localStorage.setItem(
            "goals",
            JSON.stringify(goals)
        );


        showGoals();

    }


    function completeGoal(index) {

        goals[index].completed = true;

        goals[index].progress = 100;


        localStorage.setItem(
            "goals",
            JSON.stringify(goals)
        );


        showGoals();

    }


    function deleteGoal(index) {

        goals.splice(index, 1);


        localStorage.setItem(
            "goals",
            JSON.stringify(goals)
        );


        showGoals();

    }


    function showGoals() {

        let goalsDiv =
            document.getElementById(
                "goals"
            );


        goalsDiv.innerHTML = "";


        if (goals.length === 0) {

            goalsDiv.innerHTML =
                "<div class='empty'>" +
                "<p>Hozircha maqsadlar yo'q.</p>" +
                "</div>";

            return;

        }


        goals.forEach(
            function(goal, index) {


                let status =
                    goal.completed
                    ? "Bajarildi"
                    : "Jarayonda";


                goalsDiv.innerHTML +=

                    "<div class='goal-card'>" +

                    "<div class='goal-title'>" +
                    goal.text +
                    "</div>" +

                    "<p class='goal-date'>" +
                    "Muddat: " +
                    goal.date +
                    "</p>" +

                    "<p>" +
                    "Holat: <strong>" +
                    status +
                    "</strong>" +
                    "</p>" +

                    "<div class='progress-box'>" +

                    "<div class='progress-bar' " +
                    "style='width: " +
                    goal.progress +
                    "%'>" +

                    "</div>" +

                    "</div>" +

                    "<p class='progress-text'>" +
                    "Progress: " +
                    goal.progress +
                    "%" +
                    "</p>" +

                    "<div class='goal-buttons'>" +

                    "<button onclick='changeProgress(" +
                    index +
                    ")'>" +

                    "Progressni o'zgartirish" +

                    "</button>" +

                    "<button onclick='completeGoal(" +
                    index +
                    ")'>" +

                    "Bajarildi" +

                    "</button>" +

                    "<button onclick='deleteGoal(" +
                    index +
                    ")'>" +

                    "O'chirish" +

                    "</button>" +

                    "</div>" +

                    "</div>";

            }
        );

    }


    showGoals();

</script>

</body>
</html>
